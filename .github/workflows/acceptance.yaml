name: Platform acceptance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Fetch pinned platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make platform-fetch
      - name: Install application dependencies
        run: |
          npm ci
          npx cypress install
      - name: Test API and build frontend
        run: make test
      - name: Install pinned cluster tools
        run: make install-tools
      - name: Validate application chart configuration
        run: make chart-test
      - name: Deploy and check application contracts
        run: make up
      - name: Verify release isolation
        run: make helm-test
      - name: Verify persistence and recovery
        run: make resilience
      - name: Browser acceptance tests
        env:
          TERM: xterm
        run: make browser-ci
      - name: Failure diagnostics
        if: failure()
        run: make diagnose
      - name: Delete disposable cluster
        if: always()
        run: make down CONFIRM="$(python3 -c 'import json; print(json.load(open("platform.json"))["cluster"])')"
