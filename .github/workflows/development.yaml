name: Development acceptance
on:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  development:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development
    concurrency:
      group: development-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Fetch pinned platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make platform-fetch
      - name: Install application dependencies
        run: |
          npm ci
          npx cypress install
      - name: Test API and build frontend
        run: make test
      - name: Install pinned cluster tools
        run: make install-tools
      - name: Validate application chart configuration
        run: make chart-test
      - name: Configure development credentials
        id: credentials
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT" || { echo 'Set the KUBECONFIG secret in environment development.' >&2; exit 1; }
          umask 077
          kubeconfig="$RUNNER_TEMP/platform-kubeconfig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$KUBECONFIG_CONTENT" > "$kubeconfig"
          printf 'KUBECONFIG=%s\nPLATFORM_ENVIRONMENT=development\n' "$kubeconfig" >> "$GITHUB_ENV"
      - name: Sign in to GHCR for image publishing
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build, publish and deploy to app-dev
        run: make development-up
      - name: Verify release isolation
        run: make helm-test
      - name: Verify development persistence and recovery
        run: make resilience
      - name: Browser acceptance tests
        env:
          TERM: xterm
        run: make browser-ci
      - name: Failure diagnostics
        if: failure() && steps.credentials.outcome == 'success'
        run: make diagnose
      - name: Remove runner credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/platform-kubeconfig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .platform/database.env
          docker logout ghcr.io || true
          # Shared cluster, releases and PVCs deliberately remain in place.
