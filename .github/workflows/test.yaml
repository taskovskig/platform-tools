name: Platform tooling checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configuration and shell checks
        run: make test
      - name: Verify CLI package installation
        run: |
          python3 -m venv "$RUNNER_TEMP/cli-test"
          "$RUNNER_TEMP/cli-test/bin/python" -m pip install .
          "$RUNNER_TEMP/cli-test/bin/platform-tools" --version
          "$RUNNER_TEMP/cli-test/bin/platform-tools" --help
          test "v$(python3 -c 'from platform_tools import __version__; print(__version__)')" = "$(cat VERSION)"
      - name: Verify release version and manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$(cat VERSION)" != "$RELEASE_TAG" ]; then
            echo "VERSION must match the release tag $RELEASE_TAG" >&2
            exit 1
          fi
          python3 scripts/release.py
          git diff --exit-code -- distribution.json
